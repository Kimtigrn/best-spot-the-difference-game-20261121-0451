<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odd Twin — Spot the Difference</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header id="hud">
  <div class="brand">ODD TWIN <span>spot the difference</span></div>
  <div class="hud-item" id="hud-level">Level 1 · Sunny Park</div>
  <div class="hud-item timer">
    <span id="hud-timer-text">2:30</span>
    <span class="timer-bar"><span id="hud-timer-fill"></span></span>
  </div>
  <div class="hud-item found" id="hud-found">0 / 7 found</div>
  <div class="hud-item">Score <b id="hud-score">0</b></div>
  <button id="btn-hint" class="hud-btn">Hint (3)</button>
  <button id="btn-pause" class="hud-btn">⏸ Pause</button>
  <button id="btn-sound" class="hud-btn">🔊 Sound on</button>
</header>
<main id="stage">
  <canvas id="game" aria-label="Odd Twin: two near-identical pictures side by side — click the differences"></canvas>
  <div id="overlay" hidden></div>
</main>
<footer id="hud-bottom">
  <span id="hud-dots">○ ○ ○ ○ ○ ○ ○</span>
  <span id="hud-message">Welcome, detective — pick a level and start the hunt!</span>
  <span class="keys">H hint · P pause · M sound · R restart</span>
</footer>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
